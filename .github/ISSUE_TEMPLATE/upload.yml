name: 입결 자료 올리기
description: Claude가 만들어 준 사이트 파일을 올려 번호가 붙은 주소를 받습니다.
title: "[자료올리기] 새 자료"
body:
  - type: markdown
    attributes:
      value: "올린 자료는 누구나 볼 수 있습니다. 파일을 첨부하고 아래의 **Create** 버튼을 누르면 2~3분 뒤 이 글에 주소가 달립니다."
  - type: textarea
    id: file
    attributes:
      label: 사이트 파일
      description: Claude가 준 .html 파일을 이 칸에 끌어다 놓으세요. 업로드가 끝나 링크가 보이면 다음으로 넘어가세요.
    validations:
      required: true
  - type: input
    id: replace
    attributes:
      label: 바꿀 자료 번호
      description: 내가 올린 자료를 새 파일로 바꿀 때만 번호를 적으세요. 처음 올린다면 비워 두세요.
      placeholder: "예: 7"
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 학생 이름 같은 개인정보가 없고, 공개해도 되는 자료입니다.
          required: true
