<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님별 입결 자료</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1c2430;--muted:#5d6878;--line:#dfe4ea;--accent:#2457c5}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1d232c;--text:#e8ecf1;--muted:#a3adba;--line:#343c48;--accent:#8db1ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:26px;line-height:1.3;margin:0 0 8px}
.lead,.meta,.small{color:var(--muted)}
.meta,.small{font-size:14px}
input{width:100%;padding:10px 12px;margin:16px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
a{color:var(--accent)}
.site{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px;text-decoration:none;color:inherit}
.site b{color:var(--accent);font-size:17px;overflow-wrap:anywhere}
.meta{margin:2px 0 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>선생님별 입결 자료</h1>
  <p class="lead">선생님들이 만든 자료 목록입니다. 쓰고 싶은 자료를 고르세요.</p>
  <input id="q" type="search" placeholder="학교나 자료 이름 검색" aria-label="학교나 자료 이름 검색">
  <div id="list"><p class="small">불러오는 중입니다.</p></div>
  <p class="small"><a href="../">기본 자료로 돌아가기</a> · <a href="../teachers.html">선생님용 안내</a></p>
</main>
<script>
(async function () {
  const list = document.getElementById('list'), q = document.getElementById('q');
  const note = text => { const p = document.createElement('p'); p.className = 'small'; p.textContent = text; list.replaceChildren(p); };
  let sites;
  try {
    const res = await fetch('index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error();
    sites = (await res.json()).sites.slice().sort((a, b) => b.id - a.id);
  } catch (e) { return note('목록을 불러오지 못했습니다.'); }

  function render() {
    const word = q.value.trim().toLowerCase();
    const hits = sites.filter(s => !word || `${s.id} ${s.title} ${s.source}`.toLowerCase().includes(word));
    if (!hits.length) return note(sites.length ? '검색 결과가 없습니다.' : '아직 올라온 자료가 없습니다.');
    list.replaceChildren(...hits.map(s => {
      const a = document.createElement('a'), b = document.createElement('b'), p = document.createElement('p');
      a.className = 'site'; a.href = `../?s=${Number(s.id)}`;
      b.textContent = `${Number(s.id)}번 · ${s.title}`;
      p.className = 'meta';
      p.textContent = [s.source, s.years, `${Number(s.rows).toLocaleString('ko-KR')}건`, `${s.updated} 갱신`].filter(Boolean).join(' · ');
      a.append(b, p);
      return a;
    }));
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
